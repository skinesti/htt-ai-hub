# Netlify configuration. Only public/ (the data-free sign-in page) is served as static files.
# The app page, scripts and API are served by netlify/functions/app.mjs after a session and allowlist check.
# documents/, seed/, db/ and scripts/ are not deployed as static files.
[build]
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"

# Scans the finished function bundle and publish folder for local secret values (see scripts/bundle-check.js).
[[plugins]]
  package = "./plugins/bundle-check"
